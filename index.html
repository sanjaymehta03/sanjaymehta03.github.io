<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sanjay Mehta | Computational Biology & AI Drug Discovery</title>
    <meta name="description" content="Personal website of Sanjay Mehta — Computational Biologist & AI Drug Discovery Scientist showcasing molecular dynamics research, papers, resume, and articles." />
    <!-- Google Fonts: Inter, Figtree, Newsreader & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Inline script to prevent theme flash -->
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('theme-mode') || localStorage.getItem('theme');
          var isDark = mode ? mode === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          var themeVal = isDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', themeVal);
          document.documentElement.style.colorScheme = themeVal;
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
